services:
  huaihua-drama:
    build: .
    image: huaihua-drama:latest
    ports:
      - "5679:5679"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=5679
      - TZ=Asia/Shanghai
      # 如需从局域网其他机器跨域访问 API，追加来源，如：
      # - CORS_ORIGINS=http://localhost:3013,http://localhost:5679,http://192.168.1.10:5679
    restart: unless-stopped
